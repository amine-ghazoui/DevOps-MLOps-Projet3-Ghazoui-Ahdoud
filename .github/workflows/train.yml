name: Train ML Model

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'params.yaml'
      - 'requirements.txt'
      - 'data/**'
  pull_request:
    branches: [ main ]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🎯 Train model
      run: |
        python src/train.py
    
    # ⬇️ DÉPLACER Setup CML ICI - AVANT de l'utiliser
    - name: 🔧 Setup CML
      uses: iterative/setup-cml@v3
    
    - name: 📦 Install CML (explicit)
      run: |
        npm install -g @dvcorg/cml || echo "CML déjà installé"
        cml --version || echo "Vérification de CML"
    
    - name: 📊 Evaluate model
      run: |
        python src/evaluate.py
    
    - name: 🔍 List generated files
      if: github.event_name == 'pull_request'
      run: |
        echo "=== Fichiers générés dans reports/ ==="
        ls -la reports/ || echo "Dossier reports/ non trouvé"
        echo ""
        echo "=== Vérification des visualisations ==="
        [ -f "reports/predictions_plot.png" ] && echo "✓ predictions_plot.png existe" || echo "✗ predictions_plot.png manquant"
        [ -f "reports/residuals_plot.png" ] && echo "✓ residuals_plot.png existe" || echo "✗ residuals_plot.png manquant"
        [ -f "reports/feature_importance.png" ] && echo "✓ feature_importance.png existe" || echo "✗ feature_importance.png manquant"
        [ -f "reports/comparison_plot.png" ] && echo "✓ comparison_plot.png existe" || echo "✗ comparison_plot.png manquant"
    
    - name: 📈 Create CML Report
      if: github.event_name == 'pull_request'
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "# 🤖 Rapport d'Entraînement ML" >> report.md
        echo "" >> report.md
        echo "**Commit**: \`${{ github.sha }}\`" >> report.md
        echo "**Auteur**: @${{ github.actor }}" >> report.md
        echo "**Branche**: \`${{ github.head_ref }}\`" >> report.md
        echo "" >> report.md
        
        # Métriques
        echo "## 📊 Métriques du Modèle" >> report.md
        echo "" >> report.md
        
        if [ -f "reports/metrics.json" ]; then
          echo "| Métrique | Valeur |" >> report.md
          echo "|----------|--------|" >> report.md
          
          RMSE=$(cat reports/metrics.json | python3 -c "import sys, json; m=json.load(sys.stdin); print(f\"{m['test']['rmse']:.2f}\")")
          MAE=$(cat reports/metrics.json | python3 -c "import sys, json; m=json.load(sys.stdin); print(f\"{m['test']['mae']:.2f}\")")
          R2=$(cat reports/metrics.json | python3 -c "import sys, json; m=json.load(sys.stdin); print(f\"{m['test']['r2']:.4f}\")")
          
          echo "| RMSE | ${RMSE} |" >> report.md
          echo "| MAE | ${MAE} |" >> report.md
          echo "| **R²** | **${R2}** |" >> report.md
        else
          echo "⚠️ Fichier metrics.json introuvable" >> report.md
        fi
        
        echo "" >> report.md
        
        # Rapport de comparaison
        if [ -f "reports/comparison_report.md" ]; then
          echo "## 📋 Comparaison avec Baseline" >> report.md
          echo "" >> report.md
          cat reports/comparison_report.md >> report.md
          echo "" >> report.md
        fi
        
        # Visualisations
        echo "## 📉 Visualisations" >> report.md
        echo "" >> report.md
        
        if [ -f "reports/predictions_plot.png" ]; then
          echo "### Prédictions vs Valeurs réelles" >> report.md
          cml publish reports/predictions_plot.png --md >> report.md
          echo "" >> report.md
        else
          echo "⚠️ Graphique predictions_plot.png non trouvé" >> report.md
        fi
        
        if [ -f "reports/residuals_plot.png" ]; then
          echo "### Résidus" >> report.md
          cml publish reports/residuals_plot.png --md >> report.md
          echo "" >> report.md
        else
          echo "⚠️ Graphique residuals_plot.png non trouvé" >> report.md
        fi
        
        if [ -f "reports/feature_importance.png" ]; then
          echo "### Importance des Features" >> report.md
          cml publish reports/feature_importance.png --md >> report.md
          echo "" >> report.md
        else
          echo "⚠️ Graphique feature_importance.png non trouvé" >> report.md
        fi
        
        if [ -f "reports/comparison_plot.png" ]; then
          echo "### Comparaison Baseline vs Actuel" >> report.md
          cml publish reports/comparison_plot.png --md >> report.md
          echo "" >> report.md
        fi
        
        echo "---" >> report.md
        echo "🤖 *Rapport généré automatiquement par CML*" >> report.md
        
        # Publier le rapport dans la PR
        cml comment create report.md
    
    - name: 📊 Display metrics (for push)
      if: github.event_name == 'push'
      run: |
        echo "=== MÉTRIQUES DU MODÈLE ==="
        if [ -f "reports/metrics.json" ]; then
          cat reports/metrics.json
        else
          echo "⚠️ Pas de fichier metrics.json"
        fi
    
    - name: 💾 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts-${{ github.run_number }}
        path: |
          models/
          reports/
        retention-days: 30