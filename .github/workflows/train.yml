name: Train ML Model

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'params.yaml'
      - 'requirements.txt'
      - 'data/**'
  pull_request:
    branches: [ main ]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4      # ⬅️ mise à jour
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install cml
    
    - name: 🎯 Train model
      run: |
        python src/train.py
    
    - name: 📈 Create CML Report
      if: github.event_name == 'pull_request'
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "# 🤖 Rapport d'Entraînement ML" >> report.md
        echo "" >> report.md
        echo "**Commit**: \`${{ github.sha }}\`" >> report.md
        echo "**Auteur**: @${{ github.actor }}" >> report.md
        echo "**Branche**: \`${{ github.head_ref }}\`" >> report.md
        echo "" >> report.md
        
        echo "## 📊 Métriques du Modèle" >> report.md
        echo "" >> report.md
        
        if [ -f "reports/metrics.json" ]; then
          echo "| Métrique | Valeur |" >> report.md
          echo "|----------|--------|" >> report.md
          
          MSE=$(cat reports/metrics.json | python3 -c "import sys, json; print(f\"{json.load(sys.stdin)['mse']:.2f}\")")
          RMSE=$(cat reports/metrics.json | python3 -c "import sys, json; print(f\"{json.load(sys.stdin)['rmse']:.2f}\")")
          MAE=$(cat reports/metrics.json | python3 -c "import sys, json; print(f\"{json.load(sys.stdin)['mae']:.2f}\")")
          R2=$(cat reports/metrics.json | python3 -c "import sys, json; print(f\"{json.load(sys.stdin)['r2']:.4f}\")")
          
          echo "| MSE (Mean Squared Error) | ${MSE} |" >> report.md
          echo "| RMSE (Root MSE) | ${RMSE} |" >> report.md
          echo "| MAE (Mean Absolute Error) | ${MAE} |" >> report.md
          echo "| **R² Score** | **${R2}** |" >> report.md
          echo "" >> report.md
          
          echo "### 💡 Interprétation" >> report.md
          echo "" >> report.md
          echo "- **R² = ${R2}** : Le modèle explique $(echo \"${R2} * 100\" | bc)% de la variance" >> report.md
          echo "- **RMSE = ${RMSE} €** : Erreur moyenne de prédiction" >> report.md
          echo "" >> report.md
        else
          echo "⚠️ Fichier metrics.json introuvable" >> report.md
        fi
        
        echo "## 📉 Visualisations" >> report.md
        echo "" >> report.md
        
        if [ -f "reports/predictions.png" ]; then
          echo "### Prédictions vs Valeurs Réelles" >> report.md
          cml-publish reports/predictions.png --md >> report.md
          echo "" >> report.md
        fi
        
        if [ -f "reports/residuals.png" ]; then
          echo "### Analyse des Résidus" >> report.md
          cml-publish reports/residuals.png --md >> report.md
          echo "" >> report.md
        fi
        
        if [ -f "reports/feature_importance.png" ]; then
          echo "### Importance des Features" >> report.md
          cml-publish feature_importance.png --md >> report.md
          echo "" >> report.md
        fi
        
        echo "---" >> report.md
        echo "🤖 *Rapport généré automatiquement par CML*" >> report.md
        
        cml comment create report.md
    
    - name: 📊 Display metrics (for push)
      if: github.event_name == 'push'
      run: |
        echo "=== MÉTRIQUES DU MODÈLE ==="
        if [ -f "reports/metrics.json" ]; then
          cat reports/metrics.json
        else
          echo "⚠️ Pas de fichier metrics.json"
        fi
    
    - name: 💾 Upload artifacts
      uses: actions/upload-artifact@v4   # ⬅️ mise à jour
      with:
        name: model-artifacts-${{ github.run_number }}
        path: |
          models/
          reports/
        retention-days: 30
    
    - name: ✅ Success notification
      if: success()
      run: |
        echo "✅ Pipeline terminé avec succès!"
        echo "📊 Métriques sauvegardées"
        echo "🤖 Modèle sauvegardé"
