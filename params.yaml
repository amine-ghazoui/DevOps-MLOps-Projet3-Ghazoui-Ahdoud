# Configuration pour le projet ML CI/CD
# Dataset: Kaggle House Prices

data:
  path: 'data/train.csv'
  test_size: 0.2
  random_state: 42
  target: 'SalePrice'

model:
  type: 'random_forest'  # Random Forest
  params:
    # Random Forest params optimisés pour meilleures performances
    n_estimators: 250  # Plus d'arbres = meilleure performance (mais plus lent)
    max_depth: 20  # Profondeur augmentée pour capturer plus de patterns
    min_samples_split: 5  # Évite l'overfitting avec des splits plus stricts
    min_samples_leaf: 2  # Chaque feuille doit avoir au moins 2 échantillons
    max_features: 'sqrt'  # Utilise sqrt(n_features) pour plus de diversité
    bootstrap: true  # Bootstrap pour réduire la variance
    max_samples: 0.8  # Utilise 80% des données par arbre pour plus de robustesse
    random_state: 42
    n_jobs: -1  # Utilise tous les CPU disponibles
    

training:
  cv_folds: 5
  verbose: 1

evaluation:
  metrics:
    - mae
    - r2
  generate_plots: true