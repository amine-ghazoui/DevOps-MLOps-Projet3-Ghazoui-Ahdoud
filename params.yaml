# Configuration pour le projet ML CI/CD
# Dataset: Kaggle House Prices

data:
  path: 'data/train.csv'
  test_size: 0.2
  random_state: 42
  target: 'SalePrice'

model:
  type: 'random_forest' 
  params:
    # Random Forest params
    n_estimators: 150
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    

training:
  cv_folds: 5
  verbose: 1

evaluation:
  metrics:
    - rmse
    - mae
    - r2
  generate_plots: true