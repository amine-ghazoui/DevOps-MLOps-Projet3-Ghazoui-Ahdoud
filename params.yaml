# Configuration pour le projet ML CI/CD
# Dataset: Kaggle House Prices

data:
  path: 'data/train.csv'
  test_size: 0.2
  random_state: 42
  target: 'SalePrice'

model:
  type: 'random_forest'  # Random Forest
  params:
    # Random Forest params optimisés pour meilleures performances
    n_estimators: 350  
    max_depth: 20  
    min_samples_split: 5  
    min_samples_leaf: 2  
    max_features: 'sqrt'  
    bootstrap: true  
    max_samples: 0.8  
    random_state: 42
    n_jobs: -1  
    

training:
  cv_folds: 5
  verbose: 1

evaluation:
  metrics:
    - mae
    - r2
  generate_plots: true