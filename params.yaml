# Configuration pour le projet ML CI/CD
# Dataset: Kaggle House Prices

data:
  path: 'data/train.csv'
  test_size: 0.2
  random_state: 42
  target: 'SalePrice'

model:
  type: 'gradient_boosting'  # Gradient Boosting généralement meilleur que Random Forest
  params:
    # Gradient Boosting params (optimisés)
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    min_samples_split: 10
    min_samples_leaf: 4
    subsample: 0.8  # Pour réduire l'overfitting
    random_state: 42
    

training:
  cv_folds: 5
  verbose: 1

evaluation:
  metrics:
    - rmse
    - mae
    - r2
  generate_plots: true